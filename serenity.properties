##Default Serenity Properties
serenity.project.name=SauceDemo Serenity BDD Framework
serenity.outputDirectory=target/site/serenity
serenity.test.root=saucedemo.com
serenity.logging=QUIET
serenity.console.headings=NORMAL
serenity.console.banner=NORMAL
serenity.take.screenshots=FOR_FAILURES
serenity.requirement.types=feature
##Default Browser Properties
webdriver.autodownload=true
webdriver.wait.for.timeout=10000
webdriver.timeouts.implicitlywait=0
serenity.use.unique.browser=true
serenity.restart.browser.for.each=SCENARIO
serenity.browser.maximized=true
##Manual Tests and Sprint Management
serenity.report.show.manual.tests=true
current.target.version=sprint-12
##Chrome Browser Headless Testing Properties
webdriver.driver=chrome
headless.mode=true
#chrome.switches="""--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;--disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;--disable-infobars,--disable-gpu"""
